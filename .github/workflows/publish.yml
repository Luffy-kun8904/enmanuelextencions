name: Build and publish repo

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build extension (firma de debug automatica)
        run: ./gradlew -p src :src:all:mangadexsafe:assembleDebug

      - name: Prepare repo branch
        run: |
          rm -rf /tmp/repo
          git worktree add --force /tmp/repo repo || git worktree add --orphan /tmp/repo
          mkdir -p /tmp/repo/apk
          rm -f /tmp/repo/apk/*
          cp src/all/mangadexsafe/build/outputs/apk/debug/*.apk /tmp/repo/apk/
          cp README.md /tmp/repo/README-source.md
          cp LICENSE /tmp/repo/LICENSE

      - name: Generate repository index
        run: |
          python3 .github/scripts/generate-repo.py

      - name: Publish repo branch
        working-directory: /tmp/repo
        run: |
          git add .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update extension repository" || true
          git push origin HEAD:repo --force
