name: Build Aniyomi extensions

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build debug APK (verificacion, no requiere firma)
        run: ./gradlew -p src :src:all:mangadexsafe:assembleDebug

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aniyomi-manga-extension-debug-apk
          path: src/all/mangadexsafe/build/outputs/apk/debug/*.apk
